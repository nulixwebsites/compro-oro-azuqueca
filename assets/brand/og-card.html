<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  /* 1200x630 brand card for og:image — Eclipse CO */
  * { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px;
    background: #FAF6EC;
    display: flex; align-items: center; justify-content: center; gap: 64px;
    font-family: Georgia, "Times New Roman", serif;
  }
  .mark { width: 340px; height: 340px; }
  .words { display: flex; flex-direction: column; }
  .name { color: #14100D; font-size: 84px; font-weight: 700; letter-spacing: 2px; }
  .city {
    margin-top: 14px; color: #6E101E; font-size: 40px; letter-spacing: 18px;
    display: flex; align-items: center; gap: 22px; font-variant: small-caps;
  }
  .city::before, .city::after { content: ""; height: 3px; width: 70px; background: #d4af37; }
  .tag { margin-top: 36px; color: #6E101E; font-size: 26px; letter-spacing: 4px; }
  .tag b { color: #C6912E; font-weight: 400; }
</style>
</head>
<body>
  <img class="mark" src="logo-mark.svg" alt="">
  <div class="words">
    <div class="name">COMPRO ORO</div>
    <div class="city">AZUQUECA</div>
    <div class="tag">TRADICIÓN <b>•</b> HONESTIDAD <b>•</b> EXPERIENCIA</div>
  </div>
</body>
</html>
